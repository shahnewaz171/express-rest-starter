services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.Dev
    container_name: express-auth-app-dev
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PG_HOST: postgres
      POSTGRES_URL: postgresql://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@postgres:5432/${PG_DATABASE:-express_auth}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - express-auth-network

  postgres:
    image: postgres:17
    container_name: express-auth-postgres-dev
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DATABASE:-express_auth}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-express_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - express-auth-network

volumes:
  pgdata:
    name: express-auth-pgdata-dev

networks:
  express-auth-network:
    name: express-auth-network-dev
    driver: bridge
